[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsheets"
version = "0.1.0"
description = "Sync tabular data (MD/CSV/TSV) to Google Sheets using a service account."
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client",
  "google-auth",
  "google-auth-httplib2",
]

[project.scripts]
tabsheets = "tabsheets.table_to_sheets:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
